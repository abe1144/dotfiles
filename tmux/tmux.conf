# ~/.config/tmux/tmux.conf
# Reload after editing:  prefix + r

# ---- Prefix: Ctrl-a (easier to reach than the default Ctrl-b) ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # press Ctrl-a twice to send a literal Ctrl-a to the shell

# ---- General ----
set -g mouse on               # click to focus panes, drag borders to resize, scroll wheel
set -g history-limit 50000
set -g base-index 1           # windows start at 1 (matches keyboard layout)
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# ---- Neovim friendliness ----
set -sg escape-time 10        # no lag after pressing <Esc>
set -g focus-events on        # lets nvim's autoread notice files changed by claude
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # true color passthrough
set -s extended-keys on       # better modifier keys (e.g. Shift+Enter) for apps that support it
set -as terminal-features ",xterm*:extkeys"

# ---- Splits (open in the current pane's directory) ----
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ---- Pane navigation: prefix + h/j/k/l, or Alt+arrow without prefix ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize: prefix + H/J/K/L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Copy mode: vi keys, y copies to macOS clipboard ----
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ---- Reload config ----
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# ---- Look ----
set -g status-position top
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[fg=colour75,bold] #S  "
set -g status-left-length 30
set -g status-right "#[fg=colour245]%H:%M "
setw -g window-status-current-style "fg=colour75,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour75"
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} "
